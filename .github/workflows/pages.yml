# Publishes the site to GitHub Pages on every push to main (https://heritiana-ankatso.github.io/Matematika/), without the
# files that are not part of the site: CLAUDE.md (instructions for coding agents) and .github/.
# One-time setup by the owner: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until then Pages serves the branch itself, CLAUDE.md included.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the site without the agent notes
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github --exclude=./CLAUDE.md -cf - . | tar -xf - -C "$RUNNER_TEMP/site"
          test ! -e "$RUNNER_TEMP/site/CLAUDE.md" && test -f "$RUNNER_TEMP/site/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
