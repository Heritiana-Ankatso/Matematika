# Publishes dist/ to GitHub Pages on every push to main (https://heritiana-ankatso.github.io/Matematika/).
# dist/ is the built site and is committed (make site writes it); nothing else of the repository is served.
# Pages source: "GitHub Actions" (repository Settings > Pages > Build and deployment), set on 14 November 2026.
# All site URLs are relative, so the site works under the /Matematika/ sub-path.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that only the built site is published
        run: test -f dist/index.html && test ! -e dist/CLAUDE.md && test ! -e dist/.github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
